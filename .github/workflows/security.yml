name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt bandit

      - name: Run Bandit (SAST) on secure app
        run: bandit -r secure -f txt -o bandit_report.txt --exit-zero && bandit -r secure -ll

      - name: Run Bandit on vulnerable app (report only)
        run: bandit -r vulnerable -f json -o bandit_vulnerable.json --exit-zero

      - name: API security tests (TC-03, TC-04)
        env:
          TARGET: secure
        run: python -m unittest -v tests/test_security.py

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            bandit_report.txt
            bandit_vulnerable.json

  dast-zap:
    runs-on: ubuntu-latest
    needs: sast-and-api-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and start app
        env:
          API_KEY: ci-test-key
        run: |
          pip install -r requirements.txt
          nohup python secure/app.py > app.log 2>&1 &
          for i in $(seq 1 20); do curl -s http://localhost:5000/api/users && break; sleep 1; done
          curl -s -X POST http://localhost:5000/api/users -H 'Content-Type: application/json' \
               -d '{"name":"demo","email":"demo@example.com"}'

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000/users"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
